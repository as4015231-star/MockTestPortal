<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KBC Mock Test - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #020111; color: white; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: linear-gradient(145deg, #10143a, #0b0d26); padding: 35px; border-radius: 15px; box-shadow: 0 0 25px rgba(255, 193, 7, 0.3); width: 100%; max-width: 350px; border: 1px solid #ffc107; box-sizing: border-box; }
        h2 { text-align: center; color: #ffc107; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ffc107; background: rgba(255, 255, 255, 0.05); color: white; border-radius: 5px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        input:focus { outline: none; background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 8px rgba(255, 193, 7, 0.5); }

        button { width: 100%; padding: 14px; background: linear-gradient(to right, #ffc107, #ff9800); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: linear-gradient(to right, #ffea00, #ffb300); transform: scale(1.02); }

        .messages { text-align: center; margin-bottom: 15px; font-size: 14px; }
        .error { color: #ff4c4c; background: rgba(255, 76, 76, 0.1); padding: 8px; border-radius: 5px; border: 1px solid #ff4c4c; }
        .success { color: #00ff00; background: rgba(0, 255, 0, 0.1); padding: 8px; border-radius: 5px; border: 1px solid #00ff00; }

        a { color: #ffc107; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }

        .forgot-link { display: block; text-align: right; font-size: 12px; margin-top: -5px; margin-bottom: 15px; font-weight: normal; color: #00c6ff; transition: 0.3s; }
        .forgot-link:hover { color: #ffc107; }

        /* 🚀 NAYA: Divider (OR) Line CSS */
        .divider { display: flex; align-items: center; text-align: center; margin-top: 20px; margin-bottom: 15px; color: #777; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #444; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        /* 🚀 NAYA: Quick Join Small Button CSS */
        .quick-join-btn { display: block; width: 100%; padding: 10px; background: transparent; color: #00c6ff; border: 1px dashed #00c6ff; border-radius: 5px; text-align: center; font-size: 14px; font-weight: bold; text-decoration: none; transition: 0.3s; }
        .quick-join-btn:hover { background: rgba(0, 198, 255, 0.1); color: #fff; border-style: solid; box-shadow: 0 0 10px rgba(0, 198, 255, 0.3); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Portal Login</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="mobile_number" placeholder="Mobile Number" maxlength="10" required>
            <input type="password" name="password" placeholder="Password" required>

            <!-- Forgot Password Link -->
            <a href="{% url 'forgot_password' %}" class="forgot-link">Forgot Password?</a>

            <button type="submit">Login</button>
        </form>

        <p style="text-align: center; margin-top: 25px; margin-bottom: 5px; font-size: 14px; color: #ccc;">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>

        <!-- 🚀 NAYA: Divider & Quick Join Button -->
        <div class="divider">OR</div>
        <a href="{% url 'quick_join_test' %}" class="quick-join-btn">⚡ Quick Join (Demo Test)</a>

    </div>

</body>
</html>
