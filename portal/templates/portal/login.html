<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KBC Mock Test - Login</title>
    <style>
        body { background-color: #020111; color: white; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: linear-gradient(145deg, #10143a, #0b0d26); padding: 35px; border-radius: 15px; box-shadow: 0 0 25px rgba(255, 193, 7, 0.3); width: 350px; border: 1px solid #ffc107; }
        h2 { text-align: center; color: #ffc107; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ffc107; background: rgba(255, 255, 255, 0.05); color: white; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; background: rgba(255, 255, 255, 0.1); }
        button { width: 100%; padding: 14px; background: linear-gradient(to right, #ffc107, #ff9800); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; text-transform: uppercase; }
        button:hover { background: linear-gradient(to right, #ffea00, #ffb300); }
        .messages { text-align: center; margin-bottom: 15px; font-size: 14px; }
        .error { color: #ff4c4c; }
        .success { color: #00ff00; }
        a { color: #ffc107; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Portal Login</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="mobile_number" placeholder="Mobile Number" maxlength="10" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px; font-size: 14px;">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
    </div>
</body>
</html>
