<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KBC Mock Test - Verify OTP</title>
    <style>
        body { background-color: #020111; color: white; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: linear-gradient(145deg, #10143a, #0b0d26); padding: 35px; border-radius: 15px; box-shadow: 0 0 25px rgba(255, 193, 7, 0.3); width: 350px; border: 1px solid #ffc107; text-align: center; }
        h2 { color: #ffc107; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #cccccc; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ffc107; background: rgba(255, 255, 255, 0.05); color: white; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 20px; letter-spacing: 5px; }
        input:focus { outline: none; background: rgba(255, 255, 255, 0.1); }
        button { width: 100%; padding: 14px; background: linear-gradient(to right, #00c6ff, #0072ff); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; text-transform: uppercase; }
        button:hover { background: linear-gradient(to right, #0072ff, #00c6ff); }
        .messages { margin-bottom: 15px; font-size: 14px; }
        .error { color: #ff4c4c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verify Email</h2>
        <p>Enter the 6-digit OTP sent to your Email ID.</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="Enter OTP" maxlength="6" required>
            <button type="submit">Verify & Create Account</button>
        </form>
    </div>
</body>
</html>
