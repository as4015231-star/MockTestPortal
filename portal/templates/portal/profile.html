<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - KBC Portal</title>
    <style>
        body { background-color: #020111; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Arial', sans-serif; padding: 20px; box-sizing: border-box; }
        .profile-card { background: rgba(255, 255, 255, 0.05); border: 2px solid #00c6ff; border-radius: 15px; padding: 30px; width: 100%; max-width: 450px; box-shadow: 0 0 20px rgba(0, 198, 255, 0.2); box-sizing: border-box; }
        .profile-card h2 { color: #ffc107; margin-top: 0; text-align: center; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #00c6ff; margin-bottom: 5px; font-weight: bold; }

        .input-field { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #00c6ff; background: rgba(0,0,0,0.5); color: white; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .input-field:focus { background: rgba(255, 255, 255, 0.1); border-color: #ffc107; }

        /* 🚀 Read-Only Fields (Mobile & Email) */
        .readonly-field { background: rgba(255,255,255,0.02); border: 1px dashed #555; color: #888; cursor: not-allowed; }
        .readonly-field:focus { border-color: #555; background: rgba(255,255,255,0.02); }

        .btn-submit { width: 100%; background: linear-gradient(90deg, #00c6ff, #0072ff); color: white; border: none; padding: 14px; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0, 198, 255, 0.5); }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #ffc107; text-decoration: none; font-size: 14px; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }

        .messages p { padding: 10px; border-radius: 5px; font-size: 14px; text-align: center; font-weight: bold; }
        .success { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; }
    </style>
</head>
<body>
    <div class="profile-card">
        <h2>👤 My Profile</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{% url 'profile' %}" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" class="input-field" value="{{ user.full_name }}" required>
            </div>

            <!-- 🚀 अगर यूज़र टीचर है, तो कोचिंग का नाम दिखाएँ -->
            {% if user.role == 'TEACHER' %}
            <div class="form-group">
                <label>Coaching Name</label>
                <input type="text" name="coaching_name" class="input-field" value="{{ user.teacher_profile.coaching_name }}" required>
            </div>
            {% endif %}

            <!-- 🚀 Read-Only Fields (ये बदल नहीं सकते) -->
            <div class="form-group">
                <label>Mobile Number (Cannot be changed)</label>
                <input type="text" class="input-field readonly-field" value="{{ user.mobile_number }}" readonly title="You cannot change your mobile number">
            </div>

            <div class="form-group">
                <label>Email Address (Cannot be changed)</label>
                <input type="email" class="input-field readonly-field" value="{{ user.email }}" readonly title="You cannot change your email address">
            </div>

            <button type="submit" class="btn-submit">💾 Save Changes</button>
        </form>

        <!-- 🚀 वापस डैशबोर्ड पर जाने का लिंक -->
        <!-- 🚀 वापस डैशबोर्ड पर जाने का लिंक -->
        {% if user.role == 'TEACHER' %}
            <a href="{% url 'teacher_dashboard' %}" class="back-link">← Back to Dashboard</a>
        {% else %}
            <!-- 🚀 यहाँ 'student_dashboard' की जगह 'home' कर दिया गया है -->
            <a href="{% url 'home' %}" class="back-link">← Back to Dashboard</a>
        {% endif %}
    </div>
</body>
</html>
