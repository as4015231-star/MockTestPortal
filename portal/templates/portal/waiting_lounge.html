<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Lounge - {{ test.title }}</title>
    <style>
        body {
            background-color: #0b0d26;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .lounge-box {
            background: #10143a;
            border: 2px solid #ffc107;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(255, 193, 7, 0.2);
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
        h2 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #ccc;
            font-size: 15px;
            line-height: 1.6;
        }
        .timer-container {
            margin-top: 30px;
            background: rgba(0, 198, 255, 0.1);
            border: 1px solid #00c6ff;
            padding: 20px;
            border-radius: 10px;
        }
        .timer-text {
            font-size: 14px;
            color: #00c6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .countdown {
            font-size: 40px;
            font-weight: bold;
            color: #ffc107;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
        }
        .btn-home {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: linear-gradient(145deg, #555, #333);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-home:hover {
            background: linear-gradient(145deg, #777, #444);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="lounge-box">
        <div class="icon">✅</div>
        <h2>टेस्ट सफलतापूर्वक सबमिट हो गया!</h2>
        <p>आपका टेस्ट सफलता पूर्वक सबमिट हो चूका है , जल्द ही टेस्ट परिणाम आपकी स्क्रीन पर प्रस्तुत होगा | </p>

        <div class="timer-container">
            <div class="timer-text">आपका रिज़ल्ट और स्कोरबोर्ड आने में बाकी समय:</div>
            <div class="countdown" id="countdownTimer">--:--</div>
        </div>

        <a href="{% url 'home' %}" class="btn-home">🏠 होम पेज पर वापस जाएं</a>
    </div>

    <script>
        // बैकएंड से मिला हुआ बाकी समय (Seconds में)
        let timeInSeconds = parseInt("{{ remaining_seconds }}");
        let timerElement = document.getElementById('countdownTimer');

        let loungeInterval = setInterval(function() {
            if (timeInSeconds <= 0) {
                clearInterval(loungeInterval);
                timerElement.innerHTML = "Loading Result... 🚀";

                // 🚀 जादू: जैसे ही समय 0 होगा, पेज अपने-आप रीलोड हो जाएगा।
                // क्योंकि समय खत्म हो चुका है, सर्वर अब 'Waiting Lounge' की जगह असली रिज़ल्ट पेज भेजेगा!
                window.location.reload();
            } else {
                let m = Math.floor(timeInSeconds / 60);
                let s = timeInSeconds % 60;

                // 09:05 वाले फॉर्मेट के लिए
                let displayM = (m < 10 ? '0' : '') + m;
                let displayS = (s < 10 ? '0' : '') + s;

                timerElement.textContent = displayM + ':' + displayS;
                timeInSeconds--;
            }
        }, 1000);
    </script>
</body>
</html>
